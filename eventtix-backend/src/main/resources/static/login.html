<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | EventTix</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="js/theme.js"></script>
</head>
<body class="login-page">

  <div class="login-card">
    <img src="assets/images/eventtix-logo.png" alt="EventTix">
    <h1>Welcome back</h1>
    <p>Log in to manage your events.</p>

    <!-- error message shows here when login fails -->
    <div class="login-error" id="loginError"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <button type="submit" class="btn btn-et-primary w-100">Log In</button>
    </form>

    <p class="login-switch">Don't have an account? <a href="register.html">Create one</a></p>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
