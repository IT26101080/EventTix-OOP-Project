<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EventTix event management – view, search, edit and delete events.">
  <meta name="theme-color" content="#1a0b3b">
  <title>Event Management | EventTix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
</head>
<body data-page="events">
  <div class="app-shell">

    <!-- ===== Sidebar (shared fragment) ===== -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="sidebar-brand" href="index.html">
        <img src="assets/images/eventtix-logo.png" alt="EventTix">
      </a>
      <nav>
        <ul class="sidebar-nav">
          <li><a class="sidebar-link" href="index.html"><i class="bi bi-grid-1x2-fill" aria-hidden="true"></i><span>Dashboard</span></a></li>
          <li><a class="sidebar-link active" aria-current="page" href="events.html"><i class="bi bi-calendar2-week-fill" aria-hidden="true"></i><span>Event Management</span></a></li>
          <li><a class="sidebar-link" href="bookings.html"><i class="bi bi-ticket-perforated-fill" aria-hidden="true"></i><span>Ticket Booking</span></a></li>
          <li><a class="sidebar-link" href="customers.html"><i class="bi bi-person-fill" aria-hidden="true"></i><span>Customer</span></a></li>
        <li data-admin-only><a class="sidebar-link" href="users.html"><i class="bi bi-people-fill" aria-hidden="true"></i><span>Users</span></a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <ul class="sidebar-footer-nav">
          <li><a class="sidebar-link" href="settings.html"><i class="bi bi-gear-fill" aria-hidden="true"></i><span>Settings</span></a></li>
        </ul>
        <hr class="sidebar-divider">
        <ul class="sidebar-footer-nav">
          <li><a class="sidebar-link" href="#" data-action="logout"><i class="bi bi-box-arrow-right" aria-hidden="true"></i><span>Log Out</span></a></li>
        </ul>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <!-- ===== /Sidebar ===== -->

    <main class="main-content">

      <!-- ===== Top header (shared fragment) ===== -->
      <header class="topbar">
        <div class="topbar-start">
          <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open navigation">
            <i class="bi bi-list" aria-hidden="true"></i>
          </button>
          <h1 class="greeting" data-greeting>Good Morning!</h1>
        </div>
        <form class="search-box" role="search" onsubmit="return false;">
          <i class="bi bi-search" aria-hidden="true"></i>
          <label for="globalSearch" class="visually-hidden">Search events</label>
          <input type="search" id="globalSearch" name="q" placeholder="Search" autocomplete="off">
        </form>
        <div class="profile-pill">
          <span class="profile-avatar" aria-hidden="true">M</span>
          <span class="profile-text">
            <span class="profile-name">Madhawa</span>
            <span class="profile-role">User</span>
          </span>
        </div>
      </header>
      <!-- ===== /Top header ===== -->

      <section class="summary-row" aria-label="Event summary">
        <div class="summary-cards">
          <article class="stat-card stat-card--purple">
            <span class="stat-card-label">Total Events</span>
            <span class="stat-card-value" data-stat="total">0</span>
          </article>
          <article class="stat-card stat-card--orange">
            <span class="stat-card-label">Active Events</span>
            <span class="stat-card-value" data-stat="active">0</span>
          </article>
          <article class="stat-card stat-card--blue">
            <span class="stat-card-label">Today&apos;s Events</span>
            <span class="stat-card-value" data-stat="today">0</span>
          </article>
        </div>
        <a class="btn btn-et-primary" href="event-form.html"><i class="bi bi-plus-circle-fill" aria-hidden="true"></i>Add New</a>
      </section>

      <section class="panel" aria-label="Events">
        <div class="table-responsive">
          <table class="table table-et">
            <thead>
              <tr>
                <th scope="col">Event</th>
                <th scope="col">Category</th>
                <th scope="col">Date and Time</th>
                <th scope="col">Venue</th>
                <th scope="col">Ticket Price</th>
                <th scope="col">Status</th>
                <th scope="col" class="col-actions"><span class="visually-hidden">Actions</span></th>
              </tr>
            </thead>
            <tbody id="eventsTableBody"></tbody>
          </table>
        </div>
      </section>

      <nav aria-label="Events pagination">
        <ul class="pagination-et" id="eventsPagination"></ul>
      </nav>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
