<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | EventTix</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="js/theme.js"></script>
</head>
<body class="login-page">

  <div class="login-card">
    <img src="assets/images/eventtix-logo.png" alt="EventTix">
    <h1>Create your account</h1>
    <p>Sign up to start booking events.</p>

    <!-- error message shows here when sign up fails -->
    <div class="login-error" id="registerError"></div>

    <form id="registerForm">
      <div class="mb-3">
        <label for="fullName" class="form-label">Full name</label>
        <input type="text" class="form-control" id="fullName" required>
      </div>
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" minlength="6" required>
        <div class="form-text">At least 6 characters.</div>
      </div>
      <div class="mb-4">
        <label for="confirmPassword" class="form-label">Confirm password</label>
        <input type="password" class="form-control" id="confirmPassword" required>
      </div>
      <button type="submit" class="btn btn-et-primary w-100">Create Account</button>
    </form>

    <p class="login-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
